<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Administrator</title><style>body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#123653,#eaf3f8);min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;width:min(420px,100%);padding:34px;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.18)}h1{color:#16324a;margin:5px 0}.muted{color:#6c8192}.group{margin:17px 0}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #cfdce5;border-radius:9px;box-sizing:border-box}button{width:100%;padding:12px;background:#176a9b;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.alert{padding:12px;border-radius:9px;margin-bottom:14px;background:#fff0f0;color:#a22e2e;border:1px solid #efc4c4}</style></head><body><div class="card"><div style="font-size:12px;letter-spacing:2px;color:#176a9b;font-weight:800">ADMINISTRATOR</div><h1>Login Admin</h1><p class="muted">Kelola dataset dan model Random Forest.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><div class="group"><label>Username</label><input name="username" autocomplete="username" required></div><div class="group"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button type="submit">Masuk</button></form></div></body></html>
