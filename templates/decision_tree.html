{% extends 'base.html' %}{% block title %}Decision Tree{% endblock %}{% block content %}<section class="page-head"><div><div class="eyebrow">ANALISIS MODEL</div><h1>Decision Tree</h1><p>Visualisasi satu pohon dari total {{ total_trees }} tree.</p></div></section><section class="panel"><div class="toolbar"><a class="secondary-btn" href="{{ url_for('decision_tree', tree=previous_tree) }}">← Sebelumnya</a><form method="get" style="display:flex;align-items:center;gap:8px"><label for="tree"><b>Pilih Tree</b></label><select class="form-select" id="tree" name="tree" onchange="this.form.submit()" style="width:150px">{% for n in range(1,total_trees+1) %}<option value="{{n}}" {% if n==tree_number %}selected{% endif %}>Tree #{{n}}</option>{% endfor %}</select></form><a class="primary-btn" href="{{ url_for('decision_tree', tree=next_tree) }}">Berikutnya →</a></div><div class="tree-image"><img src="data:image/png;base64,{{ img_tree }}"></div></section>{% endblock %}
